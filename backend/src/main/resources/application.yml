spring:
  application:
    name: ticket-management
  datasource:
    url: jdbc:h2:file:./data/tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      embedding:
        model: nomic-embed-text
      chat:
        options:
          model: llama3.2
      init:
        pull-model-strategy: when_missing

app:
  tickets:
    limits:
      title-max: 120
      description-max: 5000
      comment-content-max: 2000
      author-max: 100
      assignee-max: 100
      resolution-notes-max: 2000
      search-term-max: 100
    categories:
      - PAYMENT
      - SHIPPING
      - ACCOUNT
      - TECHNICAL
      - OTHER
    comments-max-per-ticket: 200
  rag:
    top-k: 5
    similarity-threshold: 0.5
    chunk:
      max-chars: 1500
      overlap-chars: 150
    embedding:
      document-prefix: ""
      query-prefix: ""
    retrieval:
      candidate-multiplier: 3
    ingestion:
      poll-interval: 2s
      max-attempts: 5
      backoff:
        initial: 5s
        multiplier: 2
        max: 5m
    context:
      max-chars: 6000
    ask:
      question-max: 500
      timeout: 60s

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
app:
  rag:
    similarity-threshold: 0.99
    ingestion:
      backoff:
        initial: 1ms

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  h2:
    console:
      enabled: true