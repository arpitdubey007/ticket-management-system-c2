spring:
  application:
    name: ticket-management
  datasource:
    url: jdbc:h2:file:./data/tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false

app:
  tickets:
    limits:
      title-max: 120
      description-max: 5000
      comment-content-max: 2000
      author-max: 100
      assignee-max: 100
      resolution-notes-max: 2000
      search-term-max: 100
    categories:
      - PAYMENT
      - SHIPPING
      - ACCOUNT
      - TECHNICAL
      - OTHER
    comments-max-per-ticket: 200

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  h2:
    console:
      enabled: true